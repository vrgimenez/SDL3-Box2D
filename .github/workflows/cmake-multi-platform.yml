name: CMake GCC Multiplatform (UCRT64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite forzar la creación manual desde la web

jobs:
  # --- JOB PARA LINUX ---
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libasound2-dev libpulse-dev libaudio-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxinerama-dev \
          libgl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache Deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-cmake-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure & Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: build/HelloSDL-B2D # Reemplaza con tu nombre de ejecutable

  # --- JOB PARA WINDOWS (UCRT64) ---
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Cache Deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-cmake-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure & Build
        shell: msys2 {0}
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      - name: Upload Windows Binary & DLL
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: |
            build/*.exe
            build/*.dll

  # --- JOB DE EMPAQUETADO FINAL ---
  package:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows] # Espera a que los anteriores terminen
    steps:
      - uses: actions/checkout@v4 # Para obtener las carpetas /fonts e /images

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Create Release Structure
        run: |
          # Crear carpetas para los paquetes finales
          mkdir -p release-linux/fonts release-linux/images
          mkdir -p release-windows/fonts release-windows/images

          # Copiar Assets (desde el repo)
          cp -r fonts/* release-linux/fonts/ || true
          cp -r images/* release-linux/images/ || true
          cp -r fonts/* release-windows/fonts/ || true
          cp -r images/* release-windows/images/ || true

          # Copiar Binario Linux
          cp downloads/bin-linux/* release-linux/

          # Copiar Binario Windows y SDL3.dll
          cp downloads/bin-windows/* release-windows/

      - name: Zip Linux Release
        run: zip -r game-linux.zip release-linux/

      - name: Zip Windows Release
        run: zip -r game-windows.zip release-windows/

      - name: Upload Final ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: final-game-packages
          path: "*.zip"
