name: CMake GCC Multiplatform (UCRT64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite forzar la creación manual desde la web

jobs:
  # --- JOB PARA LINUX ---
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libasound2-dev libpulse-dev libaudio-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
          libxinerama-dev libxxf86vm-dev libgl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache Deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-cmake-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure & Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      - name: Prepare Artifact
        run: |
          mkdir dist
          cp build/HelloSDL-B2D dist/
          cp -r images dist/
          cp -r fonts dist/

      - name: Upload Linux Demo
        uses: actions/upload-artifact@v4
        with:
          name: demo-linux
          path: dist/

  # --- JOB PARA WINDOWS (UCRT64) ---
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Cache Deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-cmake-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure & Build
        shell: msys2 {0}
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir dist
          cp build/*.exe dist/
          cp build/*.dll dist/
          cp -r images dist/
          cp -r fonts dist/

      - name: Upload Windows Demo
        uses: actions/upload-artifact@v4
        with:
          name: demo-windows
          path: dist/

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para crear el Release
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          # Busca la línea de PRODUCT_VERSION_STR y captura el contenido de las comillas
          VERSION=$(sed -n 's/.*PRODUCT_VERSION_STR.*"\([^"]*\)".*/\1/p' version.h)

          if [ -z "$VERSION" ]; then
            echo "Error: No se pudo extraer la versión de PRODUCT_VERSION_STR en version.h"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión detectada: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true # <--- Esto crea el changelog solo
          files: |
            demo-linux/*
            demo-windows/*
          body: |
            ## 🚀 Demo Build (Automated)
            Esta es la versión **v${{ steps.get_version.outputs.VERSION }}** compilada automáticamente.
            
            ### 🛠 Instalación:
            1. Descarga el zip de tu plataforma.
            2. Descomprime y ejecuta el binario.
            
            ---
            *Los cambios detallados se encuentran abajo:*
